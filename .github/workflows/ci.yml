name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  # config.settings.test extends dev.py and swaps in an in-memory SQLite
  # DB (see that file's docstring), so these never touch a real database —
  # decouple's config() just needs them to be set to import cleanly.
  SECRET_KEY: ci-placeholder-key
  DATABASE_URL: postgresql://user:pass@localhost:5432/db
  ALLOWED_HOSTS: localhost

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
