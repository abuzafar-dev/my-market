name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  # config.settings.test extends dev.py and swaps in an in-memory SQLite
  # DB (see that file's docstring), so these never touch a real database —
  # decouple's config() just needs them to be set to import cleanly.
  SECRET_KEY: ci-placeholder-key
  DATABASE_URL: postgresql://user:pass@localhost:5432/db
  ALLOWED_HOSTS: localhost

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Known vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        run: python manage.py test

      - name: Date-sensitive tests on edge days
        # Monday, the 1st, New Year, 29 Feb (week/month/year = one day), and
        # 02:00 in Tashkent (the previous day in UTC, where aware datetimes
        # and DB date truncation can disagree). Every app that works with
        # dates: reports, sales, catalog (expiry), debt + notifications
        # (due dates, reminders). See scripts/run_tests_on_day.py.
        run: |
          apps="apps.reports apps.sales apps.catalog apps.debt apps.notifications"
          for day in 2026-11-02 2026-11-01 2027-01-01 2028-02-29; do
            python scripts/run_tests_on_day.py "$day" $apps
          done
          python scripts/run_tests_on_day.py 2026-11-03 --at 02:00 $apps

      - name: Backup scripts test
        run: bash scripts/test_backup.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Known vulnerabilities (npm audit, runtime deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
