# Sent with every response nginx itself produces (the SPA files, photos).
# `always` = also on 4xx/5xx. Django adds its own for /api and /admin.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
# The barcode scanner and product photo need the camera — this site only.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
