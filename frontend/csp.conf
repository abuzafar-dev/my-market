# Content-Security-Policy for the app's HTML page. Everything comes from this
# origin: no third-party scripts, styles, fonts or connections — so even if an
# XSS bug slipped in, injected code could not load a payload or send data out.
#   style-src 'unsafe-inline': Vue sets inline style="" attributes (bars, widths).
#   img-src blob:/data:       : live photo previews and small inline icons.
#   media-src blob:           : the camera preview.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
