# One public address for everything: the SPA, the API, the Django admin, the
# static files and the product photos. The app therefore runs same-origin
# (no CORS, and the SameSite=Strict refresh cookie just works).

# Tell Django which scheme the *browser* used. When a TLS proxy (Caddy) sits in
# front it sends X-Forwarded-Proto; when nothing does, fall back to our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Product photos are resized in the browser to a few hundred KB; leave room.
    client_max_body_size 12m;

    # Slow-client (slowloris) protection.
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Never serve dotfiles (.git, .env, .htaccess ...) even if one got copied in.
    location ~ /\. {
        deny all;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Django admin CSS/JS (served by whitenoise inside the backend).
    location ^~ /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Uploaded product photos: the backend writes them to the shared `media`
    # volume, nginx serves them straight from it. They come from the same origin
    # as the app, so they are locked down: never sniffed as anything else, and a
    # CSP that would stop a document from running any script or loading anything.
    location ^~ /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public";
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    }

    # Uptime check.
    location = /healthz/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    # Vue Router uses history mode — any path that isn't a real static
    # file falls back to index.html so client-side routing can take over.
    location / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change; the service worker + index.html must.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
