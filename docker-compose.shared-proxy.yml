services:
  frontend:
    networks:
      default: {}
      proxy:
        aliases:
          # The name the shared Caddy forwards to (reverse_proxy <alias>:80).
          # Must be unique on that network: a staging stack sets
          # PROXY_ALIAS=my-market-staging, or both stacks would answer to the
          # same name and Caddy would mix staging and production.
          - ${PROXY_ALIAS:-my-market}

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK in .env (name of the shared proxy network)}
